workflows:
  command-android-material:
    name: Command Android material execution
    instance_type: linux_x2
    max_build_duration: 60
    environment:
      java: 17
    scripts:
      - name: Material Android build
        script: |
          set -euo pipefail
          gradle --version
          gradle --no-daemon -p frontend/command-android clean lintDebug testDebugUnitTest assembleDebug
      - name: Collect APK and AAPT evidence
        script: |
          set -euo pipefail
          mkdir -p codemagic-artifacts
          APK="$(find frontend/command-android -type f -path '*/build/outputs/apk/debug/*.apk' | sort)"
          test "$(printf '%s\n' "$APK" | sed '/^$/d' | wc -l)" -eq 1
          cp "$APK" codemagic-artifacts/command-debug.apk
          AAPT="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee codemagic-artifacts/aapt-badging.txt
          grep -F "package: name='com.reisos.command'" codemagic-artifacts/aapt-badging.txt
          sha256sum "$APK" | tee codemagic-artifacts/command-debug.apk.sha256
    artifacts:
      - codemagic-artifacts/**
