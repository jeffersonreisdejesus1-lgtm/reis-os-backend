workflows:
  cupuwa-p0-material:
    name: CUPUWA P0 material execution
    max_build_duration: 60
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: sofia/cupuwa-p0-001
          include: true
          source: true
      cancel_previous_builds: true
    environment:
      java: 17
    scripts:
      - name: Material CUPUWA P0 build
        script: |
          set -euo pipefail
          test ! -d frontend/command-android || echo 'COMMAND_MODULE_PRESENT_BUT_OUT_OF_SCOPE'
          mkdir -p codemagic-artifacts
          gradle --version 2>&1 | tee codemagic-artifacts/gradle-version.log
          gradle --no-daemon -p frontend/cupuwa :app:clean :app:lintDebug :app:testDebugUnitTest :app:assembleDebug 2>&1 | tee codemagic-artifacts/gradle-build.log
      - name: Collect CUPUWA APK and evidence
        script: |
          set -euxo pipefail
          mkdir -p codemagic-artifacts/junit codemagic-artifacts/lint
          APK="$(find frontend/cupuwa -type f -path '*/build/outputs/apk/debug/*.apk' | sort)"
          test "$(printf '%s\n' "$APK" | sed '/^$/d' | wc -l)" -eq 1
          cp "$APK" codemagic-artifacts/cupuwa-debug.apk
          AAPT="$(find "${ANDROID_HOME:-${ANDROID_SDK_ROOT}}" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          "$AAPT" dump badging "$APK" | tee codemagic-artifacts/aapt-badging.txt
          grep -F "package: name='com.jsonsoftware.cupuwa'" codemagic-artifacts/aapt-badging.txt
          grep -F "application-label:'CUPUWA'" codemagic-artifacts/aapt-badging.txt
          grep -F "launchable-activity: name='com.jsonsoftware.cupuwa.MainActivity'" codemagic-artifacts/aapt-badging.txt
          ! grep -F "android.permission.INTERNET" frontend/cupuwa/app/src/main/AndroidManifest.xml
          ! grep -F "android.permission.INTERNET" codemagic-artifacts/aapt-badging.txt
          sha256sum "$APK" | tee codemagic-artifacts/cupuwa-debug.apk.sha256
          find frontend/cupuwa -type f -path '*/build/test-results/*/*.xml' | sort | tee codemagic-artifacts/junit-xml-list.txt
          JUNIT_COUNT=0
          : > codemagic-artifacts/junit-verdict.txt
          while IFS= read -r report; do
            rel="${report#frontend/cupuwa/}"
            mkdir -p "codemagic-artifacts/junit/$(dirname "$rel")"
            cp "$report" "codemagic-artifacts/junit/$rel"
            JUNIT_COUNT=$((JUNIT_COUNT + 1))
            grep -Eq 'failures="0"' "$report"
            grep -Eq 'errors="0"' "$report"
            ! grep -Eq 'failures="[1-9]|errors="[1-9]' "$report"
            printf '%s failures=0 errors=0\n' "$rel" | tee -a codemagic-artifacts/junit-verdict.txt
          done < <(find frontend/cupuwa -type f -path '*/build/test-results/*/*.xml' | sort)
          grep -F 'LedgerMathTest' codemagic-artifacts/junit-xml-list.txt
          printf 'JUNIT_XML_COUNT=%s\n' "$JUNIT_COUNT" | tee -a codemagic-artifacts/evidence-manifest.txt
          test "$JUNIT_COUNT" -ge 1
          find frontend/cupuwa -type f \( -path '*/build/reports/lint-results-*.html' -o -path '*/build/reports/lint-results-*.xml' \) | sort | tee codemagic-artifacts/lint-report-list.txt
          LINT_COUNT=0
          while IFS= read -r report; do
            cp "$report" "codemagic-artifacts/lint/$(basename "$report")"
            LINT_COUNT=$((LINT_COUNT + 1))
          done < <(find frontend/cupuwa -type f \( -path '*/build/reports/lint-results-*.html' -o -path '*/build/reports/lint-results-*.xml' \) | sort)
          printf 'LINT_REPORT_COUNT=%s\n' "$LINT_COUNT" | tee -a codemagic-artifacts/evidence-manifest.txt
          test "$LINT_COUNT" -ge 1
          {
            echo 'MISSION=CUPUWA-P0-MATERIAL-PROOF-001'
            echo "HEAD=$(git rev-parse HEAD)"
            echo 'PACKAGE=com.jsonsoftware.cupuwa'
            echo 'LABEL=CUPUWA'
            echo 'COMMAND_SEPARATE=true'
            echo 'INTERNET=false'
            echo 'DEVICE=NOT_EXECUTED_IN_CI'
          } | tee -a codemagic-artifacts/evidence-manifest.txt
    artifacts:
      - codemagic-artifacts/**
