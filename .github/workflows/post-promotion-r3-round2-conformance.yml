name: Post Promotion R3 Round2 Conformance

on:
  push:
    branches:
      - repair/post-promotion-r3-round2-conformance-v0
  pull_request:
    paths:
      - "app/universal_kernel/**"
      - "tests/test_post_promotion_r3_round2_conformance.py"
      - "tests/test_post_promotion_r3_conformance.py"
      - "tests/test_universal_kernel_r1a.py"
      - ".github/workflows/post-promotion-r3-round2-conformance.yml"

jobs:
  round2-conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: Round2 adversarial conformance
        run: pytest -q tests/test_post_promotion_r3_round2_conformance.py
      - name: Post-promotion R3 regression
        run: pytest -q tests/test_post_promotion_r3_conformance.py
      - name: R1 regression
        run: pytest -q tests/test_universal_kernel_r1a.py
      - name: R2 regression
        run: pytest -q tests/test_r2_profile_bindings.py
      - name: R3 regression
        run: pytest -q tests/test_r3_critical_causal_slices.py
      - name: Ruff targeted surfaces
        run: ruff check app/universal_kernel tests/test_post_promotion_r3_round2_conformance.py tests/test_post_promotion_r3_conformance.py
      - name: Mypy kernel
        run: mypy app/universal_kernel
