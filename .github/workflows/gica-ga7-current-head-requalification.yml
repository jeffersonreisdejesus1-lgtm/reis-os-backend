name: GICA GA7 Current Head Requalification

on:
  push:
    branches:
      - gica/ga4-slice-001-program-contract-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qualify-ga7:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@v4
        with:
          ref: gica/ga4-slice-001-program-contract-core
          fetch-depth: 1

      - name: Readback HEAD
        run: |
          git rev-parse HEAD
          git status --short

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e '.[dev]'

      - name: GA7 minimum substrate requalification
        run: pytest -q tests/test_gica_ga7_minimum_substrate.py

      - name: Ruff GA7 substrate
        run: ruff check tests/test_gica_ga7_minimum_substrate.py app/gica

      - name: Mypy GICA
        run: mypy app/gica
