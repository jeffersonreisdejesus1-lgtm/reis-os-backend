name: R1 Universal Kernel

on:
  push:
    branches:
      - ref/r1-universal-kernel-v0
  pull_request:
    paths:
      - 'app/universal_kernel/**'
      - 'tests/test_universal_kernel_r1a.py'
      - '.github/workflows/r1-universal-kernel.yml'

jobs:
  r1a-kernel-invariants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project test dependencies
        run: python -m pip install -e '.[dev]'
      - name: Run R1A kernel invariant harness
        run: pytest -q tests/test_universal_kernel_r1a.py
