name: R1 Universal Kernel Implementation

on:
  push:
    branches:
      - implementation/r1-universal-kernel-v0
  pull_request:
    paths:
      - 'app/universal_kernel/**'
      - 'tests/test_universal_kernel_r1a.py'
      - '.github/workflows/r1-universal-kernel.yml'

jobs:
  r1-kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: R1A harness
        run: pytest -q tests/test_universal_kernel_r1a.py
      - name: Ruff kernel
        run: ruff check app/universal_kernel tests/test_universal_kernel_r1a.py
      - name: Mypy kernel
        run: mypy app/universal_kernel
