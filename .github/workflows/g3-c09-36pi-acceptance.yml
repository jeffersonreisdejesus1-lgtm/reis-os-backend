name: G3 C09 36 PI Acceptance

on:
  pull_request:
  push:
    branches:
      - evidence/g3-c09-36pi-acceptance-v0

jobs:
  c09-acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: C09 acceptance package tests
        run: pytest -q tests/test_g3_c09_36pi_acceptance.py
      - name: R1 regression
        run: pytest -q tests/test_universal_kernel_r1a.py
      - name: R2 regression
        run: pytest -q tests/test_r2_profile_bindings.py
      - name: R3 regression
        run: pytest -q tests/test_r3_critical_causal_slices.py
      - name: Post-promotion regressions
        run: |
          pytest -q tests/test_post_promotion_r3_conformance.py
          pytest -q tests/test_post_promotion_r3_round2_conformance.py
          pytest -q tests/test_post_promotion_r3_fourth_round_conformance.py
      - name: Ruff
        run: ruff check app/c09_acceptance tests/test_g3_c09_36pi_acceptance.py
      - name: Mypy evidence package
        run: mypy app/c09_acceptance
