name: OCS-X Gemini Pretrial Assurance

on:
  push:
    branches:
      - dedala/ocsx-assurance-repair-001
    paths:
      - 'scripts/run_ocsx_gemini_pretrial_assurance.py'
      - 'formal/ocsx/preparation/**'
      - '.github/workflows/ocsx-gemini-pretrial-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gemini-pretrial-assurance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GEMINI_API_KEY_RAW: ${{ secrets.GEMINI_API_KEY }}
      OCSX_GEMINI_MODEL: gemini-3.7-flash
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v6
        with:
          ref: dedala/ocsx-assurance-repair-001
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Prepare Gemini credential
        shell: bash
        run: |
          set -euo pipefail
          CLEAN_KEY="$(printf '%s' "$GEMINI_API_KEY_RAW" | tr -d '\r\n')"
          if [ -z "$CLEAN_KEY" ]; then
            echo 'GEMINI_API_KEY repository secret is not configured.'
            exit 2
          fi
          echo "::add-mask::$CLEAN_KEY"
          printf 'GEMINI_API_KEY=%s\n' "$CLEAN_KEY" >> "$GITHUB_ENV"

      - name: Verify package before provider invocation
        run: python scripts/validate_ocsx_pretrial_package.py

      - name: Gemini independent pretrial assurance
        run: python scripts/run_ocsx_gemini_pretrial_assurance.py

      - name: Bind exact execution metadata
        if: always()
        shell: bash
        run: |
          mkdir -p artifacts/ocsx-gemini-pretrial-assurance
          {
            echo "source_head=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "provider=gemini"
            echo "model=${OCSX_GEMINI_MODEL}"
            echo "timestamp=$(date --utc --iso-8601=seconds)"
          } > artifacts/ocsx-gemini-pretrial-assurance/execution.txt
          sha256sum \
            scripts/run_ocsx_gemini_pretrial_assurance.py \
            scripts/validate_ocsx_pretrial_package.py \
            formal/ocsx/preparation/OCSX-PRETRIAL-READINESS-READBACK-001.md \
            formal/ocsx/preparation/OCSX-EXPERIMENT-PREPARATION-ENVELOPE-001.md \
            formal/ocsx/preparation/OCSX-AUTHORITY-ISOLATION-ENVELOPE-001.md \
            formal/ocsx/preparation/OCSX-EVIDENCE-AND-READBACK-CONTRACT-001.md \
            formal/ocsx/preparation/OCSX-TRIAL-DESIGN-PREREGISTRATION-001.md \
            formal/ocsx/preparation/OCSX-OUTCOME-CLASSIFICATION-CONTRACT-001.md \
            formal/ocsx/preparation/OCSX-REPRODUCIBILITY-MANIFEST-001.md \
            formal/ocsx/preparation/OCSX-PAIRED-TASKSET-001.json \
            > artifacts/ocsx-gemini-pretrial-assurance/SHA256SUMS

      - name: Upload Gemini assurance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ocsx-gemini-pretrial-assurance-evidence
          path: artifacts/ocsx-gemini-pretrial-assurance/
          if-no-files-found: error
