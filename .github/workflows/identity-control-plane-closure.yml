name: Identity Control Plane Closure

on:
  pull_request:
    paths:
      - "app/identity_control_plane.py"
      - "app/ocs_instances/**"
      - "app/universal_kernel/**"
      - "tests/test_identity_control_plane.py"
      - ".github/workflows/identity-control-plane-closure.yml"
  workflow_dispatch:

jobs:
  identity-control-plane:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact candidate
        uses: actions/checkout@v6

      - name: Configure Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Static checks
        run: |
          ruff check app/identity_control_plane.py tests/test_identity_control_plane.py
          mypy app/identity_control_plane.py

      - name: Identity control plane adversarial regression
        run: |
          mkdir -p artifacts
          pytest -q tests/test_identity_control_plane.py \
            --junitxml=artifacts/identity-control-plane.xml

      - name: Existing identity and OCS-instance regression
        run: |
          pytest -q \
            tests/test_r1_universal_kernel.py \
            tests/test_r2_profile_bindings.py \
            tests/test_ocs_instance_runtime.py \
            --junitxml=artifacts/existing-identity-regression.xml

      - name: Exact-head evidence
        if: always()
        run: |
          {
            echo "commit=${GITHUB_SHA}"
            echo "ref=${GITHUB_REF}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "timestamp=$(date --utc --iso-8601=seconds)"
          } > artifacts/execution.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: identity-control-plane-evidence
          path: artifacts/
          if-no-files-found: error
