name: REIS OS Execution Plane E2E

on:
  pull_request:
    paths:
      - 'app/execution_plane/**'
      - 'app/chat_runtime/**'
      - 'tests/test_reis_os_execution_plane.py'
      - '.github/workflows/execution-plane-e2e.yml'

jobs:
  execution-plane-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_reis_os_execution_plane.py
