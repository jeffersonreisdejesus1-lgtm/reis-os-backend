name: Command Android E2E Longitudinal

on:
  pull_request:
    paths:
      - 'frontend/command-android/**'
      - '.github/workflows/command-android-e2e-longitudinal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  longitudinal-command-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Longitudinal build, lint, unit and flow proof
        run: gradle --no-daemon -p frontend/command-android lintDebug testDebugUnitTest assembleDebug

      - name: Assert lint evidence
        run: test -f frontend/command-android/build/reports/lint-results-debug.html

      - name: Assert debug artifact
        run: |
          set -euo pipefail
          find frontend/command-android/build/outputs/aar -maxdepth 1 -type f -name '*-debug.aar' -print -quit | grep -q .

      - name: Assert longitudinal test executed
        run: |
          set -euo pipefail
          test -f frontend/command-android/build/test-results/testDebugUnitTest/TEST-reisos.command.LongitudinalFlowChecks.xml
          grep -q 'failures="0"' frontend/command-android/build/test-results/testDebugUnitTest/TEST-reisos.command.LongitudinalFlowChecks.xml

      - name: Boundary declaration
        run: |
          echo 'COMMAND_ANDROID_E2E_LONGITUDINAL_001=true'
          echo 'SYNTHETIC_END_TO_END_ONLY=true'
          echo 'LIVE_BACKEND=false'
          echo 'POSTGRES=false'
          echo 'REAL_ATLAS_L5=false'
          echo 'AI_RUNTIME=false'
          echo 'KERNEL_MUTATION=false'
          echo 'REAL_DEVICE_ACCESSIBILITY_NOT_PROVEN=true'
