name: Command Android E2E Longitudinal

on:
  pull_request:
    paths:
      - 'frontend/command-android/**'
      - '.github/workflows/command-android-e2e-longitudinal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  longitudinal-command-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Longitudinal product-slice build, lint, unit and flow proof
        run: gradle --no-daemon -p frontend/command-android lintDebug testDebugUnitTest assembleDebug

      - name: Assert lint evidence
        run: test -f frontend/command-android/build/reports/lint-results-debug.html

      - name: Assert executable debug APK
        run: |
          set -euo pipefail
          find frontend/command-android/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit | grep -q .

      - name: Assert longitudinal suites executed
        run: |
          set -euo pipefail
          for suite in LongitudinalFlowChecks ProductSliceE2EChecks; do
            report="frontend/command-android/build/test-results/testDebugUnitTest/TEST-reisos.command.${suite}.xml"
            test -f "$report"
            grep -q 'failures="0"' "$report"
            grep -q 'errors="0"' "$report"
          done

      - name: Assert launcher and offline boundary
        run: |
          set -euo pipefail
          manifest='frontend/command-android/src/main/AndroidManifest.xml'
          grep -q 'android.intent.action.MAIN' "$manifest"
          grep -q 'android.intent.category.LAUNCHER' "$manifest"
          grep -q 'com.android.application' frontend/command-android/build.gradle.kts
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo 'Unexpected INTERNET permission in synthetic offline slice' >&2
            exit 1
          fi

      - name: Boundary declaration
        run: |
          echo 'COMMAND_ANDROID_PRODUCT_SLICE_E2E_001=true'
          echo 'EXECUTABLE_ANDROID_APPLICATION=true'
          echo 'SYNTHETIC_END_TO_END_ONLY=true'
          echo 'INTERNET_PERMISSION=false'
          echo 'LIVE_BACKEND=false'
          echo 'POSTGRES=false'
          echo 'REAL_ATLAS_L5=false'
          echo 'AI_RUNTIME=false'
          echo 'KERNEL_MUTATION=false'
          echo 'PRODUCTION_READINESS_NOT_PROVEN=true'
          echo 'REAL_DEVICE_ACCESSIBILITY_NOT_PROVEN=true'
