name: Command Android E2E Longitudinal

on:
  pull_request:
    paths:
      - 'frontend/command-android/**'
      - '.github/workflows/command-android-e2e-longitudinal.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  longitudinal-command-proof:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Longitudinal product-slice build, lint, unit and flow proof
        run: gradle --no-daemon -p frontend/command-android lintDebug testDebugUnitTest assembleDebug

      - name: Assert lint evidence
        run: test -f frontend/command-android/build/reports/lint-results-debug.html

      - name: Assert executable debug APK and launchable activity
        id: apk
        run: |
          set -euo pipefail
          module='frontend/command-android'
          apk="$(find "$module/build/outputs/apk/debug" -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$apk"
          aapt="$(find "$ANDROID_HOME/build-tools" -type f -name aapt -print | sort -V | tail -1)"
          test -n "$aapt"
          "$aapt" dump badging "$apk" | tee "$module/build/apk-badging.txt"
          grep -q "package: name='com.reisos.command'" "$module/build/apk-badging.txt"
          grep -q "launchable-activity: name='reisos.command.app.MainActivity'" "$module/build/apk-badging.txt"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      - name: Assert longitudinal suites executed
        run: |
          set -euo pipefail
          for suite in LongitudinalFlowChecks ProductSliceE2EChecks ProductDataCatalogChecks; do
            report="frontend/command-android/build/test-results/testDebugUnitTest/TEST-reisos.command.${suite}.xml"
            test -f "$report"
            grep -q 'failures="0"' "$report"
            grep -q 'errors="0"' "$report"
          done

      - name: Assert launcher and offline boundary
        run: |
          set -euo pipefail
          manifest='frontend/command-android/src/main/AndroidManifest.xml'
          grep -q 'android.intent.action.MAIN' "$manifest"
          grep -q 'android.intent.category.LAUNCHER' "$manifest"
          grep -q 'com.android.application' frontend/command-android/build.gradle.kts
          if grep -q 'android.permission.INTERNET' "$manifest"; then
            echo 'Unexpected INTERNET permission in synthetic offline slice' >&2
            exit 1
          fi

      - name: Emit longitudinal evidence receipt
        run: |
          set -euo pipefail
          out='frontend/command-android/build/longitudinal-evidence-receipt.txt'
          cat > "$out" <<EOF
          MISSION=COMMAND_ANDROID_PRODUCT_SLICE_E2E_001
          HEAD_SHA=${GITHUB_SHA}
          EXECUTABLE_ANDROID_APPLICATION=true
          PACKAGE=com.reisos.command
          LAUNCHER=reisos.command.app.MainActivity
          S0_S9_MODELLED=true
          TEN_OCS_ROSTER_MODELLED=true
          OPERATION_CATALOG_MODELLED=true
          EVIDENCE_CATALOG_MODELLED=true
          SYSTEM_CATALOG_MODELLED=true
          NAVIGATION_RESTORE_TESTED=true
          LONGITUDINAL_FLOW_TESTED=true
          PRODUCT_CATALOG_TESTED=true
          LINT_REPORT_PRESENT=true
          APK_BADGING_VERIFIED=true
          INTERNET_PERMISSION=false
          LIVE_BACKEND=false
          POSTGRES=false
          REAL_ATLAS_L5=false
          AI_RUNTIME=false
          KERNEL_MUTATION=false
          PRODUCTION_READINESS_NOT_PROVEN=true
          REAL_DEVICE_ACCESSIBILITY_NOT_PROVEN=true
          EOF
          cat "$out"

      - name: Upload longitudinal evidence package
        uses: actions/upload-artifact@v4
        with:
          name: command-android-product-slice-${{ github.sha }}
          if-no-files-found: error
          path: |
            ${{ steps.apk.outputs.apk }}
            frontend/command-android/build/apk-badging.txt
            frontend/command-android/build/longitudinal-evidence-receipt.txt
            frontend/command-android/build/reports/lint-results-debug.html
            frontend/command-android/build/test-results/testDebugUnitTest/*.xml

      - name: Boundary declaration
        run: |
          echo 'COMMAND_ANDROID_PRODUCT_SLICE_E2E_001=true'
          echo 'EXECUTABLE_ANDROID_APPLICATION=true'
          echo 'SYNTHETIC_END_TO_END_ONLY=true'
          echo 'INTERNET_PERMISSION=false'
          echo 'LIVE_BACKEND=false'
          echo 'POSTGRES=false'
          echo 'REAL_ATLAS_L5=false'
          echo 'AI_RUNTIME=false'
          echo 'KERNEL_MUTATION=false'
          echo 'PRODUCTION_READINESS_NOT_PROVEN=true'
          echo 'REAL_DEVICE_ACCESSIBILITY_NOT_PROVEN=true'
