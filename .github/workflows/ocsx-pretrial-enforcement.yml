name: OCS-X Pretrial Enforcement

on:
  push:
    branches:
      - dedala/ocsx-assurance-repair-001
    paths:
      - 'app/ocsx_pretrial/**'
      - 'tests/test_ocsx_pretrial_enforcement.py'
      - 'scripts/run_ocsx_pretrial_enforcement.py'
      - '.github/workflows/ocsx-pretrial-enforcement.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pretrial-enforcement:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install focused test tools
        run: python -m pip install 'pytest>=8.4,<9.0' 'ruff>=0.12,<1.0' 'mypy>=1.17,<2.0'

      - name: Ruff focused harness
        run: ruff check app/ocsx_pretrial tests/test_ocsx_pretrial_enforcement.py scripts/run_ocsx_pretrial_enforcement.py

      - name: Mypy focused harness
        run: mypy --strict app/ocsx_pretrial scripts/run_ocsx_pretrial_enforcement.py

      - name: Adversarial enforcement tests
        run: pytest -q tests/test_ocsx_pretrial_enforcement.py

      - name: Generate deterministic evidence
        run: |
          mkdir -p evidence/ocsx/pretrial
          python scripts/run_ocsx_pretrial_enforcement.py \
            | tee evidence/ocsx/pretrial/enforcement-result.json
          sha256sum \
            app/ocsx_pretrial/harness.py \
            tests/test_ocsx_pretrial_enforcement.py \
            scripts/run_ocsx_pretrial_enforcement.py \
            evidence/ocsx/pretrial/enforcement-result.json \
            > evidence/ocsx/pretrial/SHA256SUMS
          git rev-parse HEAD > evidence/ocsx/pretrial/SOURCE_HEAD.txt

      - name: Upload pretrial evidence
        uses: actions/upload-artifact@v4
        with:
          name: ocsx-pretrial-enforcement-evidence
          path: evidence/ocsx/pretrial/
          if-no-files-found: error
