name: GICA GA4 Slice 001

on:
  pull_request:
    paths:
      - 'app/gica/**'
      - 'tests/test_gica_ga4_slice_001_contracts.py'
      - 'tests/test_gica_ga6_durable_ledger.py'
      - '.github/workflows/gica-ga4-slice-001.yml'

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: GICA GA4 contract tests
        run: pytest -q tests/test_gica_ga4_slice_001_contracts.py
      - name: GICA GA6 durable ledger tests
        run: pytest -q tests/test_gica_ga6_durable_ledger.py
      - name: Ruff
        run: ruff check app/gica tests/test_gica_ga4_slice_001_contracts.py tests/test_gica_ga6_durable_ledger.py
      - name: Mypy
        run: mypy app/gica
