name: Dédala Expertise Registry

on:
  workflow_dispatch:

jobs:
  dedala-expertise-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - run: >-
          pytest -q
          tests/test_dedala_expertise_registry.py
          tests/test_dedala_expertise_retrieval.py
          tests/test_dedala_expertise_derivation.py
          tests/test_dedala_expertise_physiology.py
          tests/test_dedala_expertise_corpus.py
          tests/test_dedala_expertise_causal_validation.py
          tests/test_dedala_expertise_targeted_repair.py
          tests/test_dedala_expertise_semantic_causality.py
