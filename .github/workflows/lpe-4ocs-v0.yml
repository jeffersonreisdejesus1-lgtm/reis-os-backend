name: LPE 4 OCS v0

on:
  push:
    branches:
      - experiment/4ocs-lpe-refactor-v0
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: pytest -q experiments/lpe_4ocs_v0/test_lpe_4ocs.py
