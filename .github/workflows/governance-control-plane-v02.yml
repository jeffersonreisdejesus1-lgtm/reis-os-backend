name: REIS OS Governance Control Plane v0.2

on:
  pull_request:
    paths:
      - 'app/governance_plane/**'
      - 'tests/test_governance_control_plane_v02.py'
      - 'docs/META-ARQ-REIS-OS-ENGINEERING-QUALITY-GOVERNANCE-REFACTOR-002.md'
      - '.github/workflows/governance-control-plane-v02.yml'

jobs:
  governance-control-plane:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: pip install -e '.[dev]'
      - run: pytest -q tests/test_governance_control_plane_v02.py
