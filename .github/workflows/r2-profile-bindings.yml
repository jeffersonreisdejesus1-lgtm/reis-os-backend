name: R2 11 OCS Profile Bindings

on:
  push:
    branches:
      - r2/10ocs-profile-bindings-v0
      - ncp/universal-11ocs-v1
  pull_request:
    paths:
      - 'app/profile_bindings/**'
      - 'tests/test_r2_profile_bindings.py'
      - '.github/workflows/r2-profile-bindings.yml'

jobs:
  r2-profile-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: R2 profile binding tests
        run: pytest -q tests/test_r2_profile_bindings.py
      - name: Frozen R1 regression harness
        run: pytest -q tests/test_universal_kernel_r1a.py
      - name: Ruff R2
        run: ruff check app/profile_bindings tests/test_r2_profile_bindings.py
      - name: Mypy R2
        run: mypy app/profile_bindings
