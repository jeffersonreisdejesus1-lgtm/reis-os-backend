name: R2 72 OCS Profile Bindings

on:
  workflow_dispatch:
  push:
    branches:
      - r2/10ocs-profile-bindings-v0
      - ncp/universal-11ocs-v1
      - cupuwa/mvp-build
      - cupuwa/reconcile-main-20260917
    paths:
      - 'app/profile_bindings/**'
      - 'tests/test_ocs_canonical_registry.py'
      - 'tests/test_r2_profile_bindings.py'
      - '.github/workflows/r2-profile-bindings.yml'
  pull_request:
    paths:
      - 'app/profile_bindings/**'
      - 'tests/test_ocs_canonical_registry.py'
      - 'tests/test_r2_profile_bindings.py'
      - '.github/workflows/r2-profile-bindings.yml'

jobs:
  r2-profile-bindings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install -e '.[dev]'
      - name: Canonical 72 OCS registry qualification
        run: pytest -q tests/test_ocs_canonical_registry.py
      - name: R2 profile binding tests
        run: pytest -q tests/test_r2_profile_bindings.py
      - name: Frozen R1 regression harness
        run: pytest -q tests/test_universal_kernel_r1a.py
      - name: Ruff profile bindings
        run: ruff check app/profile_bindings tests/test_ocs_canonical_registry.py tests/test_r2_profile_bindings.py --ignore E501
      - name: Mypy profile bindings
        run: mypy app/profile_bindings
