name: CUPUWA Integrated Reconciliation Qualification

on:
  workflow_dispatch:
  push:
    branches:
      - cupuwa/reconcile-main-20260917

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e '.[dev]'
      - name: CUPUWA contract substrate
        run: pytest -q tests/test_cupuwa_multi_ocs_contract_substrate.py
      - name: Canonical 72 OCS and profile bindings
        run: pytest -q tests/test_ocs_canonical_registry.py tests/test_cupuwa_visual_ocs_profiles.py tests/test_r2_profile_bindings.py tests/test_universal_kernel_r1a.py
      - name: Runtime P1 and execution regressions
        run: pytest -q tests/test_runtime_p1_remediation.py tests/test_execution_bindings.py tests/test_trading_runtime_v1.py tests/test_trial2_integrity_repairs.py tests/test_trial2_persistent_store.py
      - name: Recursive runtime hardening
        working-directory: ci/recursive-runtime
        run: pytest -q tests/test_hardening_r001_r002.py
      - name: Ruff integrated surface
        run: ruff check app/cupuwa_multi_ocs app/profile_bindings app/execution_bindings.py app/trading_runtime/economics.py app/single_surface_trial/trial2_integrity.py tests/test_cupuwa_multi_ocs_contract_substrate.py tests/test_ocs_canonical_registry.py tests/test_cupuwa_visual_ocs_profiles.py tests/test_runtime_p1_remediation.py --ignore E501
      - name: Mypy integrated surface
        run: mypy app/cupuwa_multi_ocs app/profile_bindings app/execution_bindings.py app/trading_runtime/economics.py app/single_surface_trial/trial2_integrity.py
